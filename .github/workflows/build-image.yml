# =============================================================================
# Build image (fork 二开用)
#   push 到 main / 打 v* tag / 手动触发 → 构建镜像并推送到 ghcr.io/<owner>/sub2api
# 部署不在 CI 里做。部署机上手动：
#   docker compose pull && docker compose up -d
# 镜像名和 tag 由部署目录 .env 里的 SUB2API_IMAGE / SUB2API_TAG 决定。
# 不要再启用 .github/workflows/release.yml：它也会往同一个 GHCR 仓库推 tag。
# =============================================================================
name: Build image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # 默认只构建 amd64；需要 arm64 时在仓库 Variables 设置 IMAGE_PLATFORMS=linux/amd64,linux/arm64
  PLATFORMS: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute image name / tags
        id: vars
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # GHCR 要求小写
          short_sha="${GITHUB_SHA::7}"
          version=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          {
            echo "image=${REGISTRY}/${owner}/sub2api"
            echo "deploy_tag=sha-${short_sha}"
            echo "version=${version}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            # main 分支 → latest
            type=raw,value=latest,enable={{is_default_branch}}
            # 每次构建 → sha-<7位>（不可变，手动部署建议用这个）
            type=raw,value=${{ steps.vars.outputs.deploy_tag }}
            # v1.2.3 tag → 1.2.3 / 1.2 / 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=sub2api
            org.opencontainers.image.description=Sub2API fork build

      - name: Set up QEMU
        if: contains(env.PLATFORMS, 'arm64')
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 上游 Dockerfile 默认用 goproxy.cn（面向国内），GitHub runner 在海外，改回官方源
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.vars.outputs.date }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha,scope=sub2api
          cache-to: type=gha,scope=sub2api,mode=max
          provenance: false
